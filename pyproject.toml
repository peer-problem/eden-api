[project]
name = "eden-api"
version = "0.1.0"
description = "EDEN tourism intelligence public API and data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "apscheduler>=3.11,<4",
  "beautifulsoup4>=4.13,<5",
  "cryptography>=45,<47",
  "defusedxml>=0.7,<1",
  "fastapi>=0.116,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "orjson>=3.11,<4",
  "openai>=2,<3",
  "prometheus-client>=0.22,<1",
  "pydantic-settings>=2.10,<3",
  "pymysql>=1.1,<2",
  "python-dateutil>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]
